name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two independent jobs so a short, fast-signal smoke failure is visible
# immediately instead of hiding behind the full-match suite:
#  - Playwright smoke: the four short guest flows (minutes);
#  - Playwright deep: the two full 9-player match specs (replay review, share
#    card). Their matches are made reproducible by a test-only seeded
#    Math.random, so retries are deliberately disabled and the job gets a
#    generous 35 minute limit for slower CI runners.
# Neither job needs any secret or Function; this workflow is independent from
# the guarded production workflow.

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npx playwright test --project=smoke

  deep:
    name: Playwright deep
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-match browser tests
        run: npx playwright test --project=deep --retries=0
