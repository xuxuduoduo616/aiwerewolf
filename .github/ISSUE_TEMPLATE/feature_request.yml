name: Feature request
description: Propose a focused improvement consistent with the roadmap
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and constraints
      description: Note multiplayer, payment, privacy, moderation, or compatibility implications.
