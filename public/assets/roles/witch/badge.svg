  </defs>
  <!-- Ink-wash moon medallion ring -->
  <circle cx="32" cy="32" r="28" fill="url(#wb-bg)" stroke="#d9d6ca" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="23.5" stroke="#64748b" stroke-width="1" stroke-dasharray="6 3"/>
